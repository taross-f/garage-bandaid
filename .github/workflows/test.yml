name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # torch 2.5.1 は Linux だと CUDA 込みの大きな wheel になるので、CPU 版が軽い arm64 の macOS で動かす
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q
